# Continuous integration for gcc-python-plugin
#
# Linux x86_64 jobs for the GCC releases this project is maintained for.
# GCC trunk and further architectures are still to come; ppc64le and
# big-endian ppc64 are tested by hand on the GCC Compile Farm meanwhile.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: GCC ${{ matrix.gcc }}, ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest release still built and tested; Python 3.10.
          - image: ubuntu:22.04
            gcc: 10
          # Python 3.12.
          - image: ubuntu:24.04
            gcc: 14
          # GCC 15 and 16 are only packaged in Debian unstable so far;
          # Python 3.14.  Unstable moves, so these two jobs can start
          # failing for reasons outside this repository.
          - image: debian:sid
            gcc: 15
          - image: debian:sid
            gcc: 16
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git make \
            gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} \
            gcc-${{ matrix.gcc }}-plugin-dev \
            python3 python3-dev python-is-python3 \
            python3-pygments python3-lxml graphviz
          # Make plain "gcc" and "g++" refer to the GCC under test
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ matrix.gcc }} 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ matrix.gcc }} 100

      - name: Check out the sources
        uses: actions/checkout@v7

      - name: Show the toolchain
        run: |
          gcc --version | head -n 1
          python3 --version

      - name: Build the plugin
        run: make -j"$(nproc)" CC=gcc plugin

      - name: Check that GCC loads the plugin
        run: |
          printf 'int main (void) { return 0; }\n' > ci-smoke.c
          printf 'import gcc\nprint("gcc-python-plugin loaded")\n' > ci-smoke.py
          LD_LIBRARY_PATH=gcc-c-api gcc -fplugin="$PWD/python.so" \
            -fplugin-arg-python-script=ci-smoke.py -c ci-smoke.c -o /dev/null \
            | tee ci-smoke.out
          grep -q 'gcc-python-plugin loaded' ci-smoke.out

      - name: Run the Python selftests
        run: make CC=gcc testcpybuilder testdejagnu

      - name: Run the test suite
        run: make CC=gcc test-suite
